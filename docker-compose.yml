services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitbot}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # `docker compose pull` uses the published image; `make up` builds this one from source.
    image: ghcr.io/88arya/fitbot:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fitbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fitbot}?sslmode=disable
      HTTP_ADDR: ":8080"
    # Published on the host at HTTP_ADDR (":port" form) so `make run` and `make up` share a port.
    ports:
      - "127.0.0.1${HTTP_ADDR:-:8080}:8080"
    healthcheck:
      test: ["CMD", "/fitbot", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
