name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spotter
          POSTGRES_PASSWORD: spotter
          POSTGRES_DB: spotter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spotter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://spotter:spotter@localhost:5432/spotter?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/spotter
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.29.0"
      - name: sqlc output is up to date
        run: sqlc diff

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate compose files
        run: |
          cp .env.example .env && touch deploy/.env
          docker compose -f docker-compose.yml config --quiet
          DOMAIN=example.com POSTGRES_PASSWORD=x SPOTTER_IMAGE=x \
            docker compose -f deploy/compose.yml --env-file /dev/null config --quiet
      - name: shellcheck
        run: shellcheck deploy/deploy.sh infra/terraform/cloud-init.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
