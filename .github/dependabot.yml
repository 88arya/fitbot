version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule: { interval: monthly }
    groups:
      compose:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: monthly }
    groups:
      terraform:
        patterns: ["*"]
